name: Notion ingest

on:
  schedule:
    - cron: "*/15 * * * *" # toutes les 15 min
  workflow_dispatch: {} # + bouton "Run workflow" pour forcer un passage

concurrency:
  group: notion-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest # FFmpeg préinstallé
    timeout-minutes: 30
    steps:
      - name: Check secrets
        id: gate
        env:
          HAS_SECRETS: ${{ secrets.NOTION_TOKEN != '' && secrets.S3_ENDPOINT != '' && secrets.DATABASE_URL != '' }}
        run: |
          echo "ok=$HAS_SECRETS" >> "$GITHUB_OUTPUT"
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "::notice::Secrets manquants (NOTION_TOKEN / S3_* / DATABASE_URL) — voir docs/TODO-lucas.md. Job sauté."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Install ingest dependencies
        if: steps.gate.outputs.ok == 'true'
        working-directory: ingest
        run: npm ci

      - name: Run Notion sync
        if: steps.gate.outputs.ok == 'true'
        working-directory: ingest
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
        run: node worker/sync-notion.js
