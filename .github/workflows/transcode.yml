name: Encodage

# Déclenché par le back-office juste après un envoi de fichier : ffmpeg ne
# peut pas tourner sur Vercel, ce runner l'a déjà installé et fait tourner le
# même pipeline que les imports en masse.
#
# workflow_dispatch et non repository_dispatch : le premier ne réclame que la
# permission « Actions » sur le jeton, le second exigerait « Contents: write »,
# qui permettrait aussi de pousser du code.
on:
  workflow_dispatch:
    inputs:
      item_id:
        description: "Identifiant de l'item à encoder"
        required: true
        type: string

# Un run par item : deux envois simultanés ne doivent pas s'annuler.
concurrency:
  group: transcode-${{ inputs.item_id }}
  cancel-in-progress: false

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # ffmpeg est absent de l'image ubuntu-24.04, et tout en dépend ici :
      # encodage vidéo, extraction du poster, décodage des HEIC.
      - name: Installer ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: ingest
        run: npm ci

      - name: Encoder l'item
        working-directory: ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          CDN_BASE_URL: ${{ secrets.CDN_BASE_URL }}
        run: node worker/process-item.js "${{ inputs.item_id }}"
