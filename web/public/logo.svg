<path id="Vector_2" transform="translate(22.9121)" d="M0 9.54654L22.9117 0V63.0072L0 44.8687V9.54654Z" fill="#F05800"/>
</g>
<g id="Headline" opacity="0.99998" transform="translate(77.8242)">
