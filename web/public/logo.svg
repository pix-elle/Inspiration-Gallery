<svg width="375" height="64" viewBox="0 0 375 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
svg { overflow: visible; }

/* L'animation joue UNE FOIS au chargement de la page puis se fige
   sur son état final : "1 both" au lieu de "infinite". Le SVG est
   chargé comme une image, son horloge repart donc à chaque
   chargement de page — pas à chaque navigation interne, le logo ne
   rejoue pas quand on passe d'un onglet à l'autre.
   NB : ne jamais écrire de balise entre chevrons dans ce bloc, il
   est parsé en XML et ça casserait tout le fichier. */

/* Le wordmark suit le thème du site (mêmes valeurs que --foreground
   dans app/globals.css) : #212121 sur fond clair, clair sur fond
   sombre — sinon il devient illisible en dark mode. */
#Headline_bg_0 { fill: #212121; }
@media (prefers-color-scheme: dark) {
  #Headline_bg_0 { fill: #ededed; }
}

@keyframes kf_Logo_Noir_1_transform_0 {
  0% {
    animation-timing-function: linear(0, 0.0169, 0.061, 0.1236, 0.1977, 0.2779, 0.36, 0.4408, 0.5181, 0.5903, 0.6564, 0.716, 0.7688, 0.815, 0.8548, 0.8887, 0.9171, 0.9407, 0.9598, 0.9752, 0.9872, 0.9965, 1.0034, 1.0083, 1.0117, 1.0138, 1.0148, 1.0152, 1.0149, 1.0142, 1.0133, 1.0122, 1.011, 1.0097, 1.0085, 1.0073, 1.0062, 1.0052, 1.0043, 1.0035, 1.0028, 1.0022, 1.0017, 1.0013, 1.0009, 1.0006, 1.0004, 1.0002, 1.0001, 0.9999, 0.9999);
    transform: translate(22.912px, 32px) rotate(0.14rad) translate(-22.912px, -32px);
  }
  25% {
    transform: translate(22.912px, 32px) rotate(0rad) translate(-22.912px, -32px);
  }
  100% {
    transform: translate(22.912px, 32px) rotate(0rad) translate(-22.912px, -32px);
  }
}
#Logo_Noir_1 {
  transform-origin: 0 0;
  animation: kf_Logo_Noir_1_transform_0 2s linear 1 both;
}
@keyframes kf_Vector_transform_0 {
  0% {
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    transform: translateY(26.272px) translateX(-30px);
  }
  20% {
    transform: translateY(26.272px) translateX(0px);
  }
  100% {
    transform: translateY(26.272px) translateX(0px);
  }
}
@keyframes kf_Vector_opacity_0 {
  0% {
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
  }
  20% {
    animation-timing-function: linear;
    opacity: 1;
  }
  100% {
    opacity: 1;
  }
}
#Vector {
  transform-origin: 0 0;
  animation:
    kf_Vector_transform_0 2s linear 1 both,
    kf_Vector_opacity_0 2s linear 1 both;
}
@keyframes kf_Vector_2_transform_0 {
  0% {
    transform: translateX(22.912px) translateX(-30px);
  }
  5% {
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    transform: translateX(22.912px) translateX(-30px);
  }
  25% {
    transform: translateX(22.912px) translateX(0px);
  }
  100% {
    transform: translateX(22.912px) translateX(0px);
  }
}
@keyframes kf_Vector_2_opacity_0 {
  0% {
    animation-timing-function: linear;
    opacity: 0;
  }
  5% {
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
  }
  25% {
    animation-timing-function: linear;
    opacity: 1;
  }
  100% {
    opacity: 1;
  }
}
#Vector_2 {
  transform-origin: 0 0;
  animation:
    kf_Vector_2_transform_0 2s linear 1 both,
    kf_Vector_2_opacity_0 2s linear 1 both;
}
@keyframes kf_Headline_transform_0 {
  0% {
    transform: translateX(77.824px) translateX(-40px);
  }
  12.5% {
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    transform: translateX(77.824px) translateX(-40px);
  }
  35% {
    transform: translateX(77.824px) translateX(0px);
  }
  100% {
    transform: translateX(77.824px) translateX(0px);
  }
}
@keyframes kf_Headline_opacity_0 {
  0% {
    animation-timing-function: linear;
    opacity: 0;
  }
  12.5% {
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
  }
  35% {
    animation-timing-function: linear;
    opacity: 1;
  }
  100% {
    opacity: 1;
  }
}
#Headline {
  transform-origin: 0 0;
  animation:
    kf_Headline_transform_0 2s linear 1 both,
    kf_Headline_opacity_0 2s linear 1 both;
}

/* Même convention que le reste du site (app/globals.css) : on coupe
   le mouvement si l'utilisateur l'a demandé. Les éléments retombent
   sur leurs attributs transform/opacity, soit l'état final. */
@media (prefers-reduced-motion: reduce) {
  #Logo_Noir_1, #Vector, #Vector_2, #Headline { animation: none; }
}
</style>
